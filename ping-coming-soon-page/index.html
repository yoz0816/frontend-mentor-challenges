<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;600;700&display=swap"rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Ping coming soon page</title>
</head>

<body>
  <main class="container">
    <section class="hero-section">
      <img class="logo" src="images/logo.svg" alt="Ping">
      <div class="header">
        <h1>We are launching <span>soon!</span></h1>
        <p>Subscribe and get notified</p>
      </div>

      <form class="subscribe-form" action="">
        <div class="input-container">
          <input type="email" name="email" id="email" placeholder="Your email address...">
          <p class="error-message">Please provide a valid email address</p>
        </div>
        <button type="submit" class="btn">Notify Me</button>
      </form>

      <img class="hero-image" src="images/illustration-dashboard.png" alt="Dashboard illustration">
      <div class="social-media">
        <a href="#" aria-label="Facebook"> <img src="images/facebook.png" alt=""></a>
        <a href="#" aria-label="Twitter"><img src="images/twitter.png" alt=""></a>
        <a href="#" aria-label="Instagram"><img src="images/instagram.png" alt=""></a>
      </div>

      <p class="copy">
        &copy; Copyright Ping. All rights reserved.
      </p>

    </section>

  </main>
  <script src="script.js"></script>

</body>
</html>
