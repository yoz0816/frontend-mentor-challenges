<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <header class="header">
      <h1>aurora.</h1>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </nav>

      <button class="btn">Let's talk</button>
    </header>

    <section class="hero-section">
      <article class="hero-content">
        <h2>
          Build bold digital experiences that
          <span>people remember.</span>
        </h2>

        <p>
          We help ambitious brands turn ideas into beautiful and useful
          digital products.
        </p>

        <button class="btn-start">Start a project</button>
      </article>

      <article class="hero-image">
        <img
          src="images/hero-illustration.svg"
          alt="Aurora Studio digital design illustration"
        >
      </article>
    </section>

    <section class="details">
      <h3>Trusted ideas. Thoughtful design. Real impact.</h3>

      <div class="card">
        <div class="card-detail">
          <h4>12+</h4>
          <p>Years creating</p>
        </div>

        <div class="card-detail">
          <h4>80</h4>
          <p>Projects launched</p>
        </div>

        <div class="card-detail">
          <h4>24</h4>
          <p>Happy partners</p>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
