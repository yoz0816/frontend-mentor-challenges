<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
      <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
      <title>Frontend Mentor | Results summary component</title>
    </head>
    <body>
      <main class="main-section">
          <div class="result">
            <p class="result1">Your Result</p>
            <article class="circle">
              <h1>76</h1>
              <p> of 100</p>
            </article>
            <h2>Great</h2>
            <p>You scored higher than 65% of the people who have taken these tests.</p>
          </div>
          <div class="summary">
            <h3>Summary</h3>
            <article class="summary-item reaction">
              <div class="left">
                <img src="assets/images/icon-reaction.svg" alt="reaction">
                <h4>Reaction</h4>
              </div>
              <p> <strong>80</strong>/ 100</p>
            </article>

            <article class="summary-item memory">
              <div class="left">
                <img src="assets/images/icon-memory.svg" alt="memory">
                <h4>Memory</h4>
              </div>
              <p><strong>92</strong>/ 100</p>
            </article>

            <article class="summary-item verbal">
              <div class="left">
                <img src="assets/images/icon-verbal.svg" alt="verbal">
                <h4>Verbal</h4>
              </div>
              <p><strong>61</strong>/ 100</p>
            </article>

            <article class="summary-item visual">
              <div class="left">
                <img src="assets/images/icon-visual.svg" alt="Visual">
                <h4>Visual</h4>
              </div>
              <p><strong>72</strong>/ 100</p>
            </article>
            
            <button class="btn">Continue</button>
          </div>
      </main>
      <footer class="attribution">
         Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="#">Your Name Here</a>.
      </footer>
    </body>
</html>
