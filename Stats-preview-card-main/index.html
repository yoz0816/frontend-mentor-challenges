<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | Stats preview card component</title>
  </head>
  <body>
    <main class="container">
      <section class="hero-content">
        <div class="hero-text">
        <h1>Get <span>insights</span> that help your business grow.</h1>
        <p class="description">Discover the benefits of data analytics and make better decisions regarding revenue, customer 
                experience, and overall efficiency.</p>
        <div class="data">
          <article class="data-content">
            <h2>10k+ </h2>
            <p>companies</p>
          </article>

          <article class="data-content">
            <h2>314</h2>
            <p>templates</p>
          </article>
          
          <article class="data-content">
            <h2>12m+</h2>
            <p>queries</p>
          </article>
        </div>
        </div>
       <div class="hero-image">
            <picture>
                <source
                    media="(max-width: 48rem)"
                    srcset="images/image-header-mobile.jpg">

                <img
                    class="hero-img"
                    src="images/image-header-desktop.jpg"
                    alt="Office workers collaborating">
            </picture>
      </div>
      </section>
    </main>
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Yoz</a>.
    </footer>
  </body>
</html>
