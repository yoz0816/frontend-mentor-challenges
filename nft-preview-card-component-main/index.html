<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>

    <main class="hero-section">
      <article class="hero-content">
        <div class="main-img-container">
          <img class="main-img" src="images/image-equilibrium.jpg" alt="Equilibrium #3429 NFT">
        </div>
        <h1><a href="#">Equilibrium #3429</a></h1>
        <p class="description">Our Equilibrium collection promotes balance and calm.</p>

        <div class="detail">
          <div class="detail-text price">
            <img src="images/icon-ethereum.svg" alt="" aria-hidden="true">
            <span>0.041 ETH</span>
          </div>
          <div class="detail-text time">
            <img src="images/icon-clock.svg" alt="" aria-hidden="true">
            <span>3 days left</span>
          </div>
        </div>
        <hr class="line">
        <footer class="profile">
          <img src="images/image-avatar.png" class="avatar" alt="Jules Wyvern">
          <p>Creation of <a href="#" class="author-name">Jules Wyvern</a></p>
        </footer>
      </article>
    </main>
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>. 
      Coded by <a href="#">Yoz</a>.
    </footer>

  </body>
</html>
