<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Base Apparel coming soon page</title>
</head>
<body>
  <main class="container">
    <section class="hero-section">
      <article class="hero-content">
        <img class="logo" src="images/logo.svg" alt="Base Apparel">
        <div class="content">
          <h1>
            <span>We're</span>
            coming soon
          </h1>
          <p>
            Hello fellow shoppers! We're currently building our new fashion store.
            Add your email below to stay up-to-date with announcements and our launch deals.
          </p>
          <form id="email-form">
            <div class="input-wrapper">
              <input type="email" id="email" placeholder="Email Address">
              <img class="error-icon" src="images/icon-error.svg" alt="">
              <button type="submit" class="submit-btn">
                <img src="images/icon-arrow.svg" alt="Submit">
              </button>
            </div>
            <p class="error-message">
              Please provide a valid email
            </p>
          </form>
        </div>
      </article>
      <article class="hero-image">
        <img src="images/hero-desktop.jpg" alt="Fashion model">
      </article>
    </section>
  </main>
  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by <a href="#">yoz</a>.
  </footer>
  <script src="script.js"></script>
</body>
</html>
